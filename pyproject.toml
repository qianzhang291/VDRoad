[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdroad"
version = "0.1.0"
description = "VDRoad: visual-directional road graph completion"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]
